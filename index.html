<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreeJs Product</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="loading">
      <div id="loading-text">Loading</div>
      <div id="loading-bar-wrap">
        <div id="loading-bar"></div>
      </div>
    </div>

    <div id="hud">WASD to drive &nbsp;·&nbsp; Space to brake &nbsp;·&nbsp; Q/E shift &nbsp;·&nbsp; R reset</div>

    <div id="cords">X: 0.00 <br>Y: 0.00 <br>Z: 0.00</div>

    <div id="settings-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"/></svg>
    </div>

    <div id="settings-panel">
      <div id="settings-header">
        <h2>Car Settings</h2>
        <button id="settings-close">X</button>
      </div>

      <div class="toggle-group">
        <label>
          <span>Transmission</span>
          <span class="toggle">
            <input type="checkbox" id="transMode" checked>
            <span class="slidert"></span>
          </span>
        </label>
        <div class="toggle-labels">
          <span id="mode-label">Automatic</span>
        </div>
      </div>
      
      <div class="slider-group">
        <label>Shift RPM <span id="val-shiftRpm">6000</span></label>
        <input type="range" id="shiftRpm" min="3000" max="7500" value="6000" step="100">
      </div>

      <div class="presets">
        <button data-preset="normal">Normal</button>
        <button data-preset="drift">Drift</button>
        <button data-preset="race">Race</button>
        <button data-preset="tank">Slow</button>
      </div>

      <div class="slider-group">
        <label>Engine Force <span id="val-engineForce">200</span></label>
        <input type="range" id="engineForce" min="0" max="600" value="200" step="5">
      </div>

      <div class="slider-group">
        <label>Steer Torque <span id="val-steerTorque">50</span></label>
        <input type="range" id="steerTorque" min="0" max="200" value="50" step="1">
      </div>

      <div class="slider-group">
        <label>Brake Force <span id="val-brakeForce">40</span></label>
        <input type="range" id="brakeForce" min="0" max="200" value="40" step="1">
      </div>

      <div class="slider-group">
        <label>Max Speed <span id="val-maxSpeed">20</span></label>
        <input type="range" id="maxSpeed" min="5" max="80" value="20" step="1">
      </div>

      <div class="slider-group">
        <label>Camera Distance <span id="val-camDist">15</span></label>
        <input type="range" id="camDist" min="5" max="40" value="15" step="0.5">
      </div>

      <div class="slider-group">
        <label>Camera Smoothness <span id="val-camLerp">0.08</span></label>
        <input type="range" id="camLerp" min="0.01" max="0.3" value="0.08" step="0.01">
      </div>
    </div>
    

    <div id="speedo">
      <svg viewBox="0 0 360 280">
        <!-- Background arc track -->
        <path d="M 30 231 A 150 150 0 0 1 330 231" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10" stroke-linecap="round"/>
    
        <!-- Fill arc (color changes in JS) -->
        <path id="rpm-arc" d="M 30 231 A 150 150 0 0 1 330 231" fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-dasharray="471.24" stroke-dashoffset="471.24"/>
    
        <!-- Red zone arc (overlay, hidden until RPM > 7000) -->
        <path id="rpm-red" d="M 30 231 A 150 150 0 0 1 330 231" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round" stroke-dasharray="471.24" stroke-dashoffset="471.24" opacity="0"/>
    
        <!-- RPM numbers 0-8 -->
        <text x="22" y="234" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">0</text>
        <text x="34" y="174" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">1</text>
        <text x="68" y="122" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">2</text>
        <text x="119" y="88" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">3</text>
        <text x="180" y="76" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">4</text>
        <text x="241" y="88" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">5</text>
        <text x="292" y="122" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" font-weight="600">6</text>
        <text x="326" y="174" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="600">7</text>
        <text x="338" y="234" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="13" font-weight="600">8</text>
    
        <!-- Needle -->
        <g id="rpm-needle">
          <line x1="180" y1="231" x2="180" y2="105" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <circle cx="180" cy="231" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/>
        <circle cx="180" cy="231" r="2" fill="#111"/>
    
        <!-- Digital speed -->
        <text x="180" y="196" text-anchor="middle" fill="#fff" font-family="monospace" font-size="34" font-weight="300" id="speedo-text">0</text>
        <text x="180" y="214" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="9" letter-spacing="2">KM/H</text>
    
        <!-- Gear indicator -->
        <text x="180" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="40" font-weight="600" id="gear-text">N</text>
      </svg>
    </div>




    <script type="module" src="/sources/index.js"></script>
  </body>
</html>
