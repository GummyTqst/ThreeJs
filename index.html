<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreeJs Product</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="loading">
      <div id="loading-text">Loading</div>
      <div id="loading-bar-wrap">
        <div id="loading-bar"></div>
      </div>
    </div>

    <div id="hud">WASD / Arrow Keys to drive &nbsp;·&nbsp; Space to brake &nbsp;·&nbsp; R to reset</div>

    <div id="cords">X: 0.00 <br>Y: 0.00 <br>Z: 0.00</div>

    <div id="settings-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"/></svg>
    </div>

    <div id="settings-panel">
      <div id="settings-header">
        <h2>Car Settings</h2>
        <button id="settings-close">X</button>
      </div>

      <div class="presets">
        <button data-preset="normal">Normal</button>
        <button data-preset="drift">Drift</button>
        <button data-preset="race">Race</button>
        <button data-preset="tank">Slow</button>
      </div>

      <div class="slider-group">
        <label>Engine Force <span id="val-engineForce">200</span></label>
        <input type="range" id="engineForce" min="0" max="600" value="200" step="5">
      </div>

      <div class="slider-group">
        <label>Steer Torque <span id="val-steerTorque">50</span></label>
        <input type="range" id="steerTorque" min="0" max="200" value="50" step="1">
      </div>

      <div class="slider-group">
        <label>Brake Force <span id="val-brakeForce">40</span></label>
        <input type="range" id="brakeForce" min="0" max="200" value="40" step="1">
      </div>

      <div class="slider-group">
        <label>Max Speed <span id="val-maxSpeed">20</span></label>
        <input type="range" id="maxSpeed" min="5" max="80" value="20" step="1">
      </div>

      <div class="slider-group">
        <label>Camera Distance <span id="val-camDist">15</span></label>
        <input type="range" id="camDist" min="5" max="40" value="15" step="0.5">
      </div>

      <div class="slider-group">
        <label>Camera Smoothness <span id="val-camLerp">0.08</span></label>
        <input type="range" id="camLerp" min="0.01" max="0.3" value="0.08" step="0.01">
      </div>
    </div>

    <div id="speedo">
      <svg viewBox="0 0 300 190">
        <path d="M 20 170 A 130 130 0 0 1 280 170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-linecap="round"/>
    
        <path id="speedo-arc" d="M 20 170 A 130 130 0 0 1 280 170" fill="none" stroke="#8cf" stroke-width="6" stroke-linecap="round" stroke-dasharray="408.4" stroke-dashoffset="408.4"/>
    
        <g id="speedo-needle">
          <line x1="150" y1="170" x2="150" y2="58" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </g>
    
        <circle cx="150" cy="170" r="5" fill="#8cf" stroke="#111" stroke-width="2"/>
        <circle cx="150" cy="170" r="2" fill="#111"/>
    
        <text x="150" y="130" text-anchor="middle" fill="#fff" font-family="monospace" font-size="48" font-weight="300" id="speedo-text">0</text>
        <text x="150" y="150" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="20" letter-spacing="3">KM/H</text>
      </svg>
    </div>

    <script type="module" src="/sources/index.js"></script>
  </body>
</html>
